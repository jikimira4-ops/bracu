<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breaking News Banner</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---- Breaking news bar ---- */
  .breaking-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;

    display: flex;
    align-items: stretch;

    /* orange -> red gradient */
    background: linear-gradient(90deg, #ff8c00 0%, #ff4500 55%, #d40000 100%);

    /* red accent line along the bottom */
    border-bottom: 4px solid #b30000;

    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);

    color: #ffffff;
    font-size: 16px;
    line-height: 1.2;
  }

  /* "BREAKING" tag on the left */
  .breaking-tag {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 12px 18px;

    background: #b30000;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;

    /* subtle pulse to draw the eye */
    animation: breaking-pulse 1.6s ease-in-out infinite;
  }

  @keyframes breaking-pulse {
    0%, 100% { background: #b30000; }
    50%      { background: #e60000; }
  }

  /* Blank white text area — put your headline inside */
  .breaking-text {
    flex: 1 1 auto;
    display: flex;
    align-items: center;

    padding: 12px 20px;
    color: #ffffff;
    font-weight: 600;

    /* keeps a long headline on one line; remove to allow wrapping */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Placeholder look while the text is empty */
  .breaking-text:empty::before {
    content: "";
    display: inline-block;
    width: 60%;
    height: 1em;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.28);
  }

  @media (prefers-reduced-motion: reduce) {
    .breaking-tag { animation: none; }
  }
</style>
</head>
<body>

  <!-- Breaking news bar -->
  <div class="breaking-bar" role="status" aria-live="polite">
    <span class="breaking-tag">Breaking</span>
    <span class="breaking-text"><!-- your headline text here --></span>
  </div>

</body>
</html>
