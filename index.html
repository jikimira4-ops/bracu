<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRAC University Campus</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .bg-image {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
    z-index: 0;
  }

  .breaking-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 110px;
    z-index: 9999;

    display: flex;
    align-items: stretch;

    background: linear-gradient(90deg, #ff8c00 0%, #ff4500 55%, #d40000 100%);
    border-bottom: 4px solid #b30000;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);

    color: #ffffff;
    font-size: 16px;
    line-height: 1.2;
  }

  .breaking-tag {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 12px 18px;

    background: #b30000;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;

    animation: breaking-pulse 1.6s ease-in-out infinite;
  }

  @keyframes breaking-pulse {
    0%, 100% { background: #b30000; }
    50%      { background: #e60000; }
  }

  .breaking-text {
    flex: 1 1 auto;
    display: flex;
    align-items: center;

    padding: 12px 20px;
    color: #ffffff;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @media (prefers-reduced-motion: reduce) {
    .breaking-tag { animation: none; }
  }
</style>
</head>
<body>

  <img class="bg-image"
       src="https://i.postimg.cc/9MvyXgY3/bracu-campus.jpg"
       alt="Aerial view of BRAC University campus">

  <div class="breaking-bar" role="status" aria-live="polite">
    <span class="breaking-tag">Breaking</span>
    <span class="breaking-text">Your headline goes here</span>
  </div>

</body>
</html>
